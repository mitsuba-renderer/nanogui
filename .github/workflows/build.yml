name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.build-type }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        build-type: [shared, static]
      fail-fast: false

    env:
      BUILD_SHARED: ${{ matrix.build-type == 'shared' && 'ON' || 'OFF' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: '3.13'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libglu1-mesa-dev libwayland-dev libxkbcommon-dev libdbus-1-dev

      # Let CMake pick the default generator for each runner (e.g. the
      # installed Visual Studio on Windows) instead of pinning a version.
      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DNANOGUI_BUILD_SHARED=${{ env.BUILD_SHARED }} \
            "-DPython_EXECUTABLE=$(python -c 'import sys; print(sys.executable)')"

      - name: Build
        run: cmake --build build -j 2 --config Release
