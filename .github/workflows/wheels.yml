name: Build Python wheels

on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload wheels to PyPI? (0: no, 1: yes)'
        required: true
        default: '0'

permissions:
  contents: read

jobs:
  build_wheels:
    strategy:
      # One native runner per platform/architecture, matching the set of
      # platforms that nanobind-backend wheels are published for.
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm,
             macos-15, macos-15-intel]
      fail-fast: false

    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    env:
      # CPython 3.10 was never released for Windows on ARM64. The stable-ABI
      # wheel is tagged cp310-abi3 regardless of the interpreter that builds
      # it (see wheel.py-api in pyproject.toml).
      CIBW_BUILD: ${{ matrix.os == 'windows-11-arm' && 'cp311-*' || 'cp310-*' }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        name: Install Python
        with:
          python-version: '3.13'

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0

      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  upload_pypi:
    name: Upload wheels to PyPI
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.upload == '1' }}
    needs: [build_wheels]

    environment:
      name: pypi
      url: https://pypi.org/p/nanogui

    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
          print-hash: true
