version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Batch all action bumps into a single PR
      actions:
        patterns:
          - "*"
    ignore:
      # Official actions use moving major tags (e.g. v4), so they
      # update automatically and don't need bumps here.
      - dependency-name: "actions/*"
